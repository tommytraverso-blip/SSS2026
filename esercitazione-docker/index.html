<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercitazione Docker - UniGe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #334155;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 7px;
            border: none;
        }

        button {
            background: #38bdf8;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐳 Docker Webserver</h1>
        <p>Esercitazione di Strumenti di Sviluppo Software</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Accedi</button>
        </form>

        <p id="messaggio"></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;

            document.getElementById("messaggio").textContent =
                "Benvenuto nel container Docker, " + username + "!";
        });
    </script>

</body>
</html>
